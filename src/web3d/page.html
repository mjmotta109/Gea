<title>Gea 3D — Prototipo visual</title>
<style>
  :root {
    --bg: #0b1014; --panel: #141c24; --line: #24313d; --ink: #d9e2ea;
    --muted: #8598a8; --player: #53d1e0;
    --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  header h1 { font-size: 13px; margin: 0; letter-spacing: 0.28em; color: var(--player); font-weight: 600; }
  header .sub { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  #seed {
    width: 80px; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--mono); font-size: 12px; padding: 4px 6px; border-radius: 3px;
  }
  #restart {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--mono); font-size: 12px; padding: 5px 10px; cursor: pointer;
  }
  #restart:hover { border-color: var(--player); color: var(--player); }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px;
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: linear-gradient(transparent, rgba(4,8,11,0.85));
    pointer-events: none;
  }
</style>

<div id="app">
  <header>
    <h1>GEA·3D</h1>
    <span class="sub">prototipo de dirección de arte · tu modelo GLB vs primitivas low-poly · arrastra para orbitar, rueda para zoom</span>
    <span class="spacer"></span>
    <label>semilla <input id="seed" type="number" value="42"></label>
    <button id="restart">Relanzar batalla</button>
  </header>
  <div id="stage"><div id="status"></div></div>
</div>
